# Runs `make regression-<part>` for dsa1_dig, the decimator and the chip as parallel jobs.
# The macros harden on the EZ130 copies in ip/. The chip part checks the delivered GDS and the committed netlist, then rebuilds on the committed dsa1_dig views.
# LEC and the FPGA builds stay local, see the regression targets in the Makefile.

name: regression

on:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 UTC. Scheduled runs only ever trigger on the default
    # branch (main). The "gate" job below skips the heavy regression when
    # nothing has changed since the previous nightly run.
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Check for changes since last nightly run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Decide whether to run
        id: check
        run: |
          # Manual runs always execute.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch -> run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled run: execute only if the tip of the default branch was
          # committed within the nightly window, i.e. there is a change since
          # the previous nightly run. (Use a window slightly larger than the
          # 24h cadence so a commit landing near the boundary is never missed.)
          head_date="$(git log -1 --format=%cI)"
          echo "Latest commit: $head_date"
          if [ -n "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "Changes since last nightly run -> run."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes since last nightly run -> skip."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  regression:
    name: make regression-${{ matrix.part }}
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [dsa1-dig, decimator, top]
    # GitHub's job limit
    timeout-minutes: 360
    # IIC-OSIC-TOOLS ships the toolchain and the IHP SG13CMOS5L PDK.
    # It runs with docker run, not as a job container: a job container is pulled before the first step, and on private-repo runners the pull filled the disk.
    env:
      # 2026.10 pinned by digest, so a new image cannot change results without a commit. The sign-off digests in scripts/image.env sit on a registry GitHub cannot reach.
      IMAGE: hpretl/iic-osic-tools:2026.10@sha256:306585de35d198e70ea58950f77147c86f56c698726a19afea9f1c83009557be
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost
          sudo docker image prune -af > /dev/null
          df -h /

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The chip top-level needs flow/artistic.
          submodules: recursive

      - name: Pull IIC-OSIC-TOOLS
        run: docker pull -q "$IMAGE"

      - name: Run regression
        # The entrypoint is skipped, so source the image's environment script.
        # It picks STD_CELL_LIBRARY from PDK, so PDK has to be set before it runs.
        # Root in the container does not own the checkout, hence safe.directory.
        # OpenROAD uses every core, nice keeps the runner agent responsive.
        run: |
          docker run --rm --user root --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/w" -w /w \
            -e PDK=ihp-sg13cmos5l -e PDK_ROOT=/foss/pdks \
            -e LIBRELANE_ARGS="-c OPENROAD_THREADS=$(nproc)" \
            "$IMAGE" -c '
              set -e
              set -a; source /etc/profile.d/iic-osic-tools-setup.sh; source /w/.designinit; set +a
              echo "PDK=$PDK STD_CELL_LIBRARY=$STD_CELL_LIBRARY PDKPATH=$PDKPATH"
              git config --global --add safe.directory "*"
              for tool in ghdl yosys verilator iverilog magic klayout librelane; do echo "$tool -> $(command -v $tool || echo NOT FOUND)"; done
              nice -n 10 make regression-${{ matrix.part }}'

      - name: Hand the workspace back to the runner user
        # The upload runs as runner and cannot read files root wrote with mode 600.
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ matrix.part }}
          path: |
            **/runs/**
            **/flow/**/*.log
            **/*.log
          if-no-files-found: ignore
