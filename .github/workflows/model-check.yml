#
# Self-test of the bit-true decimator model on every push, in about a second.
# It checks that the compensator term table still reconstructs its taps and that the chain still has the dc gain those taps imply.
# The nightly regression covers the rest.

name: Model Check

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  model-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Self-test the decimator model
        run: python3 models/decimator_model.py --self-test

      - name: Check the files generated from the register map
        run: |
          python3 -m pip install --quiet pyyaml
          python3 macros/scripts/regmap_gen.py --check
          python3 macros/scripts/regmap_gen.py --selftest
          python3 models/regmap.py

      - name: Self-test the FPGA master's program assembler
        run: python3 testbenches/fpga/seq/seqasm.py --self-test

      - name: Self-test the bench capture checker
        run: python3 models/bench_capture.py --self-test
