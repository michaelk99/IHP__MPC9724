meta:
  version: 3
  flow: Chip
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    # Disable KLayout DRC
    #KLayout.DRC: null
    #Checker.KLayoutDRC: null

    # Disable Magic DRC
    #Magic.DRC: null
    #Checker.MagicDRC: null

    # Disable KLayout antenna check
    #KLayout.Antenna: null
    #Checker.KLayoutAntenna: null

    # Disable KLayout density check
    #KLayout.Density: null
    #Checker.KLayoutDensity: null

    # Save time
    #OpenROAD.IRDropReport: null
    #KLayout.XOR: null
    #Netgen.LVS: null
    #Checker.LVS: null

    # Use Magic.Filler instead of KLayout.Filler
    # This can help in some cases where the target
    # density cannot be met using KLayout.
    #KLayout.Filler: Magic.Filler

    # Disable KLayout filler (all layers)
    # TODO: add custom LibreLane step for filler insertion after ArtistIC added logo.
    KLayout.Filler: null

    # TODO: Add GDSFill

    # Disable setup-violation errors
    #Checker.SetupViolations: null

    # Fix hold violations by inserting buffers
    #"+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    #"+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"


# INSERT_ECO_BUFFERS:
#  - target: rst_n_pad/Y
#    buffer: sg13cmos5l_buf_4

DESIGN_NAME: sg13cmos5l_dsa1_dig_top
VERILOG_FILES:
- dir::../../rtl/sg13cmos5l_dsa1_dig_top.sv
- dir::../../rtl/sg13cmos5l_dsa1_dig_core.sv

VERILOG_DEFINES: [FUNCTIONAL]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True
# SLANG_ARGUMENTS: ['--keep-hierarchy']

# The sg13cmos5l PDK already defaults to KLayout for GDS streamout
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# ================================================================
# Padframe layout: a 1300 um die in a QFN24, 660 um between the corner cells on each side.
# Order convention:
#   - PAD_WEST  : bottom to top
#   - PAD_EAST  : bottom to top
#   - PAD_NORTH : left   to right
#   - PAD_SOUTH : left   to right
# Pad-cell instance names follow the generate-block hierarchy in
# rtl/sg13cmos5l_dsa1_dig_top.sv (e.g. "g_outputs[0].output_pad").
# See doc/pinout.md for the full pin table.
# ================================================================

# West (bottom to top): supplies, the vdd clamp and the unbonded second IOVDD cell only.
PAD_WEST: [
    "g_vss_pads\\[0\\].vss_pad",         # VSS, downbonded to the paddle, ground lead 5
    clamp_vddvss,                       # vdd-to-vss ESD clamp, 120 um, no bondpad
    "g_vdd_pads\\[0\\].vdd_pad",         # VDD, lead 4
    "g_iovss_pads\\[0\\].iovss_pad",     # IOVSS, downbonded to the paddle, ground lead 3
    "g_iovdd_pads\\[0\\].iovdd_pad",     # IOVDD, lead 2
    "g_iovdd_pads\\[1\\].iovdd_pad"      # IOVDD, not bonded, a second iovdd-to-iovss ESD clamp
]

# North (left to right): reset, clock and the SPI slave.
PAD_NORTH: [
    rst_n_pad,                          # rst_n, lead 24
    clk_pad,                            # clk, lead 23
    "g_inputs\\[1\\].input_pad",         # sclk, lead 22
    "g_inputs\\[2\\].input_pad",         # mosi, lead 21
    "g_inputs\\[3\\].input_pad",         # ss, lead 20
    "g_outputs\\[0\\].output_pad"        # miso, lead 19
]

# East (bottom to top): dsm2's analog pads, VDDA and its clamp.
PAD_EAST: [
    vi_pad,                             # vi, lead 14
    vcm_pad,                            # vcm, lead 15
    ib_pad,                             # ibias_test, lead 16
    vdda_pad,                           # VDDA, IOPadVdd on the segment's band, lead 17
    clamp_vdda,                         # VDDA-to-VSS ESD clamp, a second clamp_vddvss, 120 um
    cut_vdd_e                           # vdd band cut, the VDDA segment ends here
]

# South (left to right): data_in, adc_conv, dsm2's ground, clock and bit stream.
PAD_SOUTH: [
    "g_inputs\\[0\\].input_pad",         # data_in, lead 7
    "g_outputs\\[1\\].output_pad",       # adc_conv, lead 8
    "g_vss_pads\\[1\\].vss_pad",         # second VSS, downbonded to the paddle, ground lead 9
    cut_vdd_s,                          # vdd band cut, the VDDA segment starts here
    dsm_clk_pad,                        # dsm_clk, lead 10
    do_q_pad,                           # do_q, lead 11
    do_q_b_pad                          # do_q_b, lead 12
]

# Pad spacing: 660 um between the corner cells on every side. OpenROAD.PadRing floors the gap to a multiple of PAD_SPACING_MULTIPLE and centres the row.
# The gaps and the leftover at both ends must land on the 1 um IO site grid, and a multiple of 2 um does that on all four sides.
# West: 5 x 80 + 120 um of pads, 20 um gaps and 20 um ends.
# East: 4 x 80 + 120 + 10 um (cut_vdd is 10 um wide), 30 um gaps and 30 um ends.
# North: 6 x 80 um, 24 um gaps and 30 um ends.
# South: 6 x 80 + 10 um, 20 um gaps and 25 um ends.
PAD_SPACING_MULTIPLE: 2

# SDC files
PNR_SDC_FILE:     dir::sg13cmos5l_dsa1_dig_top.sdc
SIGNOFF_SDC_FILE: dir::sg13cmos5l_dsa1_dig_top.sdc
FALLBACK_SDC:     dir::sg13cmos5l_dsa1_dig_top.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET:  clk_pad/p2c

CLOCK_PERIOD: 950 # ns, clk as the SDC constrains it. The SDC sets its own clocks, this only feeds LibreLane's defaults.

# Floorplanning
FP_SIZING: absolute
DIE_AREA:  [0, 0, 1300, 1300]
# The core ends at dsm2's halo (x 945). A core strip east of the halo would get Metal4 stripes whose via stacks put Metal3 pads every 6.72 um into the corridor of the analog wires.
CORE_AREA: [345, 345, 945, 955]

# Increase for more logic on your die
PL_TARGET_DENSITY_PCT: 10
GRT_ALLOW_CONGESTION:  true

# Bondpads
# Override bondpad name
PAD_BONDPAD_NAME: sg13cmos5l_ip__bondpad_70x70

# The bondpad LEF and GDS are not listed here. They reach EXTRA_LEFS and
# EXTRA_GDS through the fragment the Makefile generates (CHIP_FRAG), together
# with the DECAPHV views, because a list set here would replace that one.

IGNORE_DISCONNECTED_MODULES:
- sg13cmos5l_ip__bondpad_70x70
- sg13cmos5l_ip__jku
- sg13cmos5l_ip__jku_names
- sg13cmos5l_ip__helm
- sg13cmos5l_ip__title

# PDN
PDN_CORE_RING: True

PDN_CORE_RING_VWIDTH: 5
PDN_CORE_RING_HWIDTH: 5
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5

PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

# Custom PDN config
PDN_CFG: dir::pdn_cfg.tcl

# decap_vdda's VDD pin is VDDA. set_global_connections adds these rules before the standard-cell ones, and the first rule that matches a pin wins, so the cell rule (any instance, pin VDD) never takes it.
# The LEF also lists its Metal4 stripe ends and west strap ends as VDD and VSS ports, all of the same pins.
PDN_MACRO_CONNECTIONS: ["vdda_decap VDDA VSS VDD VSS"]

# Custom pad files for PADBARE
PAD_LEFS:
  - dir::../../ip/sg13cmos5l_io_custom/lef/sg13cmos5l_io.lef
  - dir::../../ip/sg13cmos5l_ip__clamp_vddvss/lef/sg13cmos5l_ip__clamp_vddvss.lef
  - dir::../../ip/sg13cmos5l_ip__cut_vdd/lef/sg13cmos5l_ip__cut_vdd.lef
PAD_VERILOG_MODELS:
  - dir::../../ip/sg13cmos5l_io_custom/verilog/sg13cmos5l_io.v
  - dir::../../ip/sg13cmos5l_ip__clamp_vddvss/verilog/sg13cmos5l_ip__clamp_vddvss.v
  - dir::../../ip/sg13cmos5l_ip__cut_vdd/verilog/sg13cmos5l_ip__cut_vdd.v

# Standard cells: EZ130 8T, the library the macro is hardened on, so the core
# rows take the thick-oxide DECAPHV decoupling. The PDK library has no
# thick-oxide decap, and its thin-oxide decap_4/8 filled the core with about
# 30 uW of leakage at typical, ten times the macro. The Makefile puts the EZ130
# fragment and CHIP_FRAG first on the librelane command line, so LIB comes from
# there: EZ130, DECAPHV and the IO liberty per corner.
DECAP_CELLS: ["DECAPHV32", "DECAPHV16", "DECAPHV8"]
# The thin-oxide decaps and the cells banned in silicon, as in macros/dsa1_dig
EXTRA_EXCLUDED_CELLS: ["BUFX1", "BUFX2", "DLY1X2", "DECAP4", "DECAP8", "DECAP16", "DECAP32",
                       "CGTSX1", "CGTSX1P5", "CGTSX2", "CGTSX3",
                       "DFFRQ2X1", "DFFRQ2X1P5", "DFFRQ2X2", "DFFRQ2X3",
                       "DFFRQ4X1", "DFFRQ4X1P5", "DFFRQ4X2", "DFFRQ4X3"]
CELL_PAD_EXCLUDE: ["FILLER*", "DECAP*", "DECAPHV*"]

# Corners
# Reduced to the three corners EZ130 is characterised at, since the one macro
# on this die is hardened on it. That also makes the core supply 1.2 V rather
# than the template's 1.5 V: EZ130 has no 1.5 V liberty.
STA_CORNERS:
  - nom_fast_1p32V_m40C
  - nom_slow_1p08V_125C
  - nom_typ_1p20V_25C

DEFAULT_CORNER: nom_typ_1p20V_25C

# Limit detailed routing to 10 iterations
# DRT_OPT_ITERS: 10

# No non-default routing rules. The template's NDR for its analog traces named
# the PDK tech LEF's Via1_DC1B, which EZ130's tech LEF does not have. The dsm2
# analog nets are drawn as special nets, not routed.

# The analog nets and the dsm2 controls stay as the RTL has them: no buffers, no repair.
# Checked against the netlist by scripts/check_analog_nets.py --rx. The core is flattened, so its gates carry the core instance as a prefix.
RSZ_DONT_TOUCH_RX: "^(vi|vcm|ibias_test|dsm_clk_PAD2CORE|dsm_do_q|dsm_do_q_b|dsm_do_q_dec|do_clk_osc|do_osc_oe|i_sg13cmos5l_dsa1_dig_core[.]u_dec_src_gate|i_sg13cmos5l_dsa1_dig_core[.]u_adc_conv_gate)$"

# dsm2 box: x 784.5 to 935, y 375 to 553. The 10 um halo grows it to x 774.5 to 945, y 365 to 563.
# decap_vdda box: x 784.5 to 934.86, y 593 to 942.44, with its halo x 774.5 to 944.86, y 583 to 952.44.
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 10
PDN_VERTICAL_HALO: 10
# The 20 um pocket between dsm2's halo and decap_vdda's (y 563 to 583, x 774.5 to 945) holds rows that no strap can reach, so cut_rows drops every row under 200 um. The VDD strips are 429 um wide.
FP_PRUNE_THRESHOLD: 200
# No PDN strap crosses the dsm2 box, decap_vdda or their halos. Metal1 to Metal4 inside the dsm2 box are blocked by the abstract's OBS, which leaves its pins reachable.
# decap_vdda sits on VDDA, so no VDD strap may touch its Metal4 and Metal3 pin ports.
PDN_OBSTRUCTIONS:
  - [Metal1, 774.5, 365, 945, 563]
  - [Metal2, 774.5, 365, 945, 563]
  - [Metal3, 774.5, 365, 945, 563]
  - [Metal4, 774.5, 365, 945, 563]
  - [TopMetal1, 774.5, 365, 945, 563]
  - [Metal1, 774.5, 583, 944.86, 952.44]
  - [Metal2, 774.5, 583, 944.86, 952.44]
  - [Metal3, 774.5, 583, 944.86, 952.44]
  - [Metal4, 774.5, 583, 944.86, 952.44]
  - [TopMetal1, 774.5, 583, 944.86, 952.44]
ROUTING_OBSTRUCTIONS:
  - [TopMetal1, 784.5, 375, 935, 553]
  - [Metal1, 774.5, 583, 944.86, 952.44]
  - [Metal2, 774.5, 583, 944.86, 952.44]
  - [Metal3, 774.5, 583, 944.86, 952.44]
  - [Metal4, 774.5, 583, 944.86, 952.44]
  - [TopMetal1, 774.5, 583, 944.86, 952.44]

MACROS:
  # ----------------------------------------------------------------
  # 1 x dsa1_dig_top, the DSADC1 digital back end
  # ----------------------------------------------------------------
  # Hardened on the EZ130 8T cells, so it ships only the three corners that
  # library is characterised at. STA_CORNERS above is reduced to match.
  dsa1_dig_top:
    gds:
      - dir::../../macros/dsa1_dig/final/gds/dsa1_dig_top.gds
    lef:
      - dir::../../macros/dsa1_dig/final/lef/dsa1_dig_top.lef
    pnl:
      - dir::../../macros/dsa1_dig/final/pnl/dsa1_dig_top.pnl.v
    nl:
      - dir::../../macros/dsa1_dig/final/nl/dsa1_dig_top.nl.v
    spef:
      nom_*: dir::../../macros/dsa1_dig/final/spef/nom/dsa1_dig_top.nom.spef
    lib:
      nom_fast_1p32V_m40C: dir::../../macros/dsa1_dig/final/lib/nom_fast_1p32V_m40C/dsa1_dig_top__nom_fast_1p32V_m40C.lib
      nom_slow_1p08V_125C: dir::../../macros/dsa1_dig/final/lib/nom_slow_1p08V_125C/dsa1_dig_top__nom_slow_1p08V_125C.lib
      nom_typ_1p20V_25C:   dir::../../macros/dsa1_dig/final/lib/nom_typ_1p20V_25C/dsa1_dig_top__nom_typ_1p20V_25C.lib
    instances:
      # West edge of the core, 10 um in so its halo stays off the west VDD core ring.
      # y 393.12 is row 14 of the chip rows (346.08 + 14 x 3.36): the halo blocks rows 11 to 13, rows 0 to 10 below and 170 to 180 above stay free for VDD decap.
      # East edge 764.08, its halo ends at 774.08, 0.42 um short of dsm2's.
      i_sg13cmos5l_dsa1_dig_core.dsa1_dig:
        location: ["expr::345 + 10", 393.12]
        orientation: N

  # ----------------------------------------------------------------
  # dsm2_core, the delta-sigma modulator abstract, 150.5 x 178 um
  # ----------------------------------------------------------------
  dsm2_core:
    gds:
      - dir::../../ip/dsm2_core/gds/dsm2_core.gds
    lef:
      - dir::../../ip/dsm2_core/lef/dsm2_core.lef
    vh:
      - dir::../../ip/dsm2_core/verilog/dsm2_core.v
    instances:
      # South-east corner of the core: east edge 20 um inside CORE_AREA[2], the lower edge 30 um above CORE_AREA[1].
      dsm2:
        location: ["expr::935 - 150.5", "expr::345 + 30"]
        orientation: N

  # ----------------------------------------------------------------
  # decap_vdda, DECAPHV on VDDA, 150.36 x 349.44 um
  # ----------------------------------------------------------------
  decap_vdda:
    gds:
      - dir::../../macros/decap_vdda/final/gds/decap_vdda.gds
    lef:
      - dir::../../macros/decap_vdda/final/lef/decap_vdda.lef
    vh:
      - dir::../../macros/decap_vdda/final/vh/decap_vdda.vh
    lib:
      nom_fast_1p32V_m40C: dir::../../macros/decap_vdda/final/lib/nom_fast_1p32V_m40C/decap_vdda__nom_fast_1p32V_m40C.lib
      nom_slow_1p08V_125C: dir::../../macros/decap_vdda/final/lib/nom_slow_1p08V_125C/decap_vdda__nom_slow_1p08V_125C.lib
      nom_typ_1p20V_25C:   dir::../../macros/decap_vdda/final/lib/nom_typ_1p20V_25C/decap_vdda__nom_typ_1p20V_25C.lib
    instances:
      # North of dsm2: 20 um above dsm2's halo top (563), plus its own 10 um halo
      vdda_decap:
        location: [784.5, 593]
        orientation: N

  # ----------------------------------------------------------------
  # Logos
  # ----------------------------------------------------------------
  sg13cmos5l_ip__jku:
    gds:
      - dir::../../ip/sg13cmos5l_ip__jku/final/gds/sg13cmos5l_ip__jku.gds
    lef:
      - dir::../../ip/sg13cmos5l_ip__jku/final/lef/sg13cmos5l_ip__jku.lef
    vh:
      - dir::../../ip/sg13cmos5l_ip__jku/final/vh/sg13cmos5l_ip__jku.vh
    lib:
      "*":
        - dir::../../ip/sg13cmos5l_ip__jku/final/lib/sg13cmos5l_ip__jku.lib
    instances:
      jku_logo:
        location: ["expr::$DIE_AREA[0] + 36.4 + 20.4", "expr::$DIE_AREA[3] - 36.4 - 120.4"]
        orientation: N

  sg13cmos5l_ip__jku_names:
    gds:
      - dir::../../ip/sg13cmos5l_ip__jku_names/final/gds/sg13cmos5l_ip__jku_names.gds
    lef:
      - dir::../../ip/sg13cmos5l_ip__jku_names/final/lef/sg13cmos5l_ip__jku_names.lef
    vh:
      - dir::../../ip/sg13cmos5l_ip__jku_names/final/vh/sg13cmos5l_ip__jku_names.vh
    lib:
      "*":
        - dir::../../ip/sg13cmos5l_ip__jku_names/final/lib/sg13cmos5l_ip__jku_names.lib
    instances:
      jku_names:
        location: ["expr::$DIE_AREA[2] - 36.4 - 120.4", "expr::$DIE_AREA[3] - 36.4 - 120.4"]
        orientation: N

  sg13cmos5l_ip__helm:
    gds:
      - dir::../../ip/sg13cmos5l_ip__helm/final/gds/sg13cmos5l_ip__helm.gds
    lef:
      - dir::../../ip/sg13cmos5l_ip__helm/final/lef/sg13cmos5l_ip__helm.lef
    vh:
      - dir::../../ip/sg13cmos5l_ip__helm/final/vh/sg13cmos5l_ip__helm.vh
    lib:
      "*":
        - dir::../../ip/sg13cmos5l_ip__helm/final/lib/sg13cmos5l_ip__helm.lib
    instances:
      # Lower-right corner, the mirror of jku_names
      helm_art:
        location: ["expr::$DIE_AREA[2] - 36.4 - 120.4", "expr::$DIE_AREA[1] + 36.4 + 20.4"]
        orientation: N

  sg13cmos5l_ip__title:
    gds:
      - dir::../../ip/sg13cmos5l_ip__title/final/gds/sg13cmos5l_ip__title.gds
    lef:
      - dir::../../ip/sg13cmos5l_ip__title/final/lef/sg13cmos5l_ip__title.lef
    vh:
      - dir::../../ip/sg13cmos5l_ip__title/final/vh/sg13cmos5l_ip__title.vh
    lib:
      "*":
        - dir::../../ip/sg13cmos5l_ip__title/final/lib/sg13cmos5l_ip__title.lib
    instances:
      # Lower-left corner, the mirror of the JKU mark
      title_art:
        location: ["expr::$DIE_AREA[0] + 36.4 + 20.4", "expr::$DIE_AREA[1] + 36.4 + 20.4"]
        orientation: N

MAGIC_GDS_FLATGLOB:
 # For DRC of SRAM macros
 - "lvsres_*"
 - "VIA_M1_*"
 - "VIA_M2_*"
 - "*_CELL_CORNER"
 - "RSC_*"
 - "*_CELL_SUB"