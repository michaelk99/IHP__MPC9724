version = 1

# Files that cannot carry an SPDX header (layout data, netlists, figures,
# generated reports and renders) are annotated here. Source files (Python
# scripts, Makefiles, RTL, configs, workflows) carry their own SPDX headers,
# so the license check still catches new source files without licensing
# information.

[[annotations]]
path = [".designinit", ".gitattributes", ".gitignore", ".gitmodules"]
SPDX-FileCopyrightText = "2026 Simon Dorrer and Harald Pretl"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = "doc/**"
SPDX-FileCopyrightText = "2026 Simon Dorrer and Harald Pretl"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = "flow/logo/**"
SPDX-FileCopyrightText = "2026 Simon Dorrer and Harald Pretl"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = ["ip/*/README.md", "ip/*/final/**", "ip/*/logo/**", "ip/*/verification/**"]
SPDX-FileCopyrightText = "2026 Simon Dorrer and Harald Pretl"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

[[annotations]]
path = "layout/**"
SPDX-FileCopyrightText = "2026 Simon Dorrer and Harald Pretl"
SPDX-License-Identifier = "Apache-2.0 WITH SHL-2.1"

