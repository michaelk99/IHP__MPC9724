name: quarto-publish

# Manual only. This publishes tutorial/ to GitHub Pages, and tutorial/ is the
# template's teaching material, not documentation of this chip. The repository
# also has no gh-pages branch, so every push-triggered run failed with
# "the remote origin does not have a branch named gh-pages". Re-enable the push
# trigger if the tutorial is ever adapted to this design, and run
# `quarto publish gh-pages` locally once first to create the branch.
on:
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install APT dependencies
        run: |
          sudo apt update
          sudo apt -y install librsvg2-bin
      
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install Python and Dependencies
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'
      - run: pip install -r tutorial/requirements.txt

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: tutorial
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
